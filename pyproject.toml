[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-trading-platform"
version = "0.1.0"
description = "Phoenix Trading Platform"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Sudhakar" }
]

dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-trading-platform"
version = "0.1.0"
description = "Phoenix Trading Platform"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Sudhakar" }
]

dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0,<2.1",
    "requests>=2.32",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring external systems or live broker connectivity",
]
pythonpath = ["."]
testpaths = ["tests"]

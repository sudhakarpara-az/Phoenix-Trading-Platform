# ============================================================
# Phoenix Trading Platform Configuration
# Version : 1.0
# ============================================================

application:
  name: "Phoenix Trading Platform"
  version: "1.0.0"
  environment: "development"

logging:
  level: "INFO"
  log_folder: "logs"
  log_file: "phoenix.log"

market:
  exchange: "NSE"
  open_time: "09:15"
  close_time: "15:30"

strategy:
  stop_loss_points: 15
  entry_buffer_points: 2

  monitor_levels:
    - k5
    - k6
    - k7

targets:
  k5: k3
  k6: k5
  k7: k6

reentry:
  k5: true
  k6: false
  k7: true

broker:
  name: "DHAN"

telegram:
  enabled: false

database:
  name: "phoenix.db"